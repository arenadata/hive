{{- /*
An ordinary Job of the release, not a hook: a pre-install hook would run before the chart's own
PostgreSQL exists, and a post-install hook only after helm --wait sees the metastore pods Ready,
which wait for this Job. Its name carries the revision, so that every install and upgrade runs it anew;
the metastore pods wait until the schema it creates is there.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "hive-metastore.name" . }}-schema-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hive-metastore.labels" (merge (dict "component" "schema") .) | nindent 4 }}
spec:
  backoffLimit: {{ .Values.schemaJob.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.schemaJob.activeDeadlineSeconds }}
  {{- with .Values.schemaJob.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ . }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "hive-metastore.labels" (merge (dict "component" "schema") .) | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: schema
          image: {{ include "hive-metastore.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The image entrypoint starts the server after the schema, so schematool is called
          # directly, after the entrypoint's configuration steps.
          command: ["/bin/bash", "-ec"]
          args:
            - |
              {{- include "hive-metastore.schematoolSetup" . | nindent 14 }}
              # Wait for the database to accept connections, when its URL names a host and port.
              hostport=$(echo {{ include "hive-metastore.db.url" . | quote }} | sed -nE 's#^jdbc:[a-z]+://([^/;?]+).*#\1#p')
              if [[ "$hostport" == *:* ]]; then
                until (exec 3<>"/dev/tcp/${hostport%:*}/${hostport##*:}") 2>/dev/null; do
                  echo "Waiting for the database at $hostport"; sleep 2
                done
              fi
              exec {{ include "hive-metastore.schematool" . }} -initOrUpgradeSchema
          env:
            {{- include "hive-metastore.passwordEnv" . | nindent 12 }}
          {{- with .Values.schemaJob.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/hive/conf-custom
            - name: ext-jars
              mountPath: /tmp/ext-jars
      volumes:
        - name: config
          secret:
            secretName: {{ include "hive-metastore.name" . }}-config
        - name: ext-jars
          emptyDir: {}
