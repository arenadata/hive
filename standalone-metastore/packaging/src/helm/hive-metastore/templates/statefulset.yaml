apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "hive-metastore.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hive-metastore.labels" . | nindent 4 }}
spec:
  # The headless Service gives every pod a stable name, which reverse DNS returns to clients and
  # Kerberos principals are made for.
  serviceName: {{ include "hive-metastore.name" . }}
  replicas: {{ .Values.replicas }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "hive-metastore.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hive-metastore.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include "hive-metastore.configData" . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "hive-metastore.selectorLabels" . | nindent 20 }}
        {{- end }}
      initContainers:
        {{- with (include "hive-metastore.jarsInitContainer" .) }}
        {{- . | nindent 8 }}
        {{- end }}
        # The server does not start on a missing or older schema: wait for the schema Job.
        - name: wait-for-schema
          image: {{ include "hive-metastore.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/bash", "-ec"]
          args:
            - |
              {{- include "hive-metastore.schematoolSetup" . | nindent 14 }}
              until {{ include "hive-metastore.schematool" . }} -info >/tmp/schema-info.log 2>&1; do
                echo "Waiting for the metastore schema"; sleep 10
              done
              grep -i "version" /tmp/schema-info.log || true
          env:
            {{- include "hive-metastore.passwordEnv" . | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/hive/conf-custom
            - name: ext-jars
              mountPath: /tmp/ext-jars
      containers:
        - name: metastore
          image: {{ include "hive-metastore.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: SERVICE_NAME
              value: metastore
            # The schema is initialized by the schema Job, not by every server.
            - name: IS_RESUME
              value: "true"
            - name: HIVE_CUSTOM_CONF_DIR
              value: /etc/hive/conf-custom
            - name: METASTORE_PORT
              value: {{ .Values.port | quote }}
            {{- include "hive-metastore.passwordEnv" . | nindent 12 }}
            {{- with (include "hive-metastore.authEnv" .) }}
            {{- . | nindent 12 }}
            {{- end }}
            - name: SERVICE_OPTS
              value: >-
                -Xmx{{ .Values.heap }}
                -Djavax.jdo.option.ConnectionPassword=$(DB_PASSWORD){{ include "hive-metastore.authJavaOpts" . }}
                {{- with .Values.extraJavaOpts }}
                {{ . }}
                {{- end }}
          ports:
            - name: thrift
              containerPort: {{ .Values.port }}
          readinessProbe:
            tcpSocket:
              port: thrift
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: thrift
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/hive/conf-custom
            - name: ext-jars
              mountPath: /tmp/ext-jars
            {{- if eq (include "hive-metastore.authType" .) "KERBEROS" }}
            - name: keytab
              mountPath: /etc/security/keytabs
              readOnly: true
            - name: krb5
              mountPath: /etc/krb5.conf
              subPath: krb5.conf
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          secret:
            secretName: {{ include "hive-metastore.name" . }}-config
        - name: ext-jars
          emptyDir: {}
        {{- if eq (include "hive-metastore.authType" .) "KERBEROS" }}
        - name: keytab
          secret:
            secretName: {{ required "auth.kerberos.keytabSecret.name is required with auth.type KERBEROS" .Values.auth.kerberos.keytabSecret.name }}
            items:
              - key: {{ .Values.auth.kerberos.keytabSecret.key }}
                path: hive.keytab
        - name: krb5
          configMap:
            name: {{ required "auth.kerberos.krb5ConfigMap.name is required with auth.type KERBEROS" .Values.auth.kerberos.krb5ConfigMap.name }}
            items:
              - key: {{ .Values.auth.kerberos.krb5ConfigMap.key }}
                path: krb5.conf
        {{- end }}
