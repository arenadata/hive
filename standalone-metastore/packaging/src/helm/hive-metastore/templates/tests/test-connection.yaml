apiVersion: v1
kind: Pod
metadata:
  name: {{ include "hive-metastore.name" . }}-test
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hive-metastore.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: thrift-port
      image: busybox:1.36
      # Every pod the Service name resolves to answers on the thrift port.
      command: ["/bin/sh", "-ec"]
      args:
        - |
          host={{ include "hive-metastore.name" . }}.{{ .Release.Namespace }}.svc.cluster.local
          addresses=$(nslookup "$host" | awk '/^Address: / { print $2 }')
          test -n "$addresses"
          for a in $addresses; do nc -z -w 5 "$a" {{ .Values.port }}; echo "$a answers"; done
