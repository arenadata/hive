services:
  runtime-init:
    image: eclipse-temurin:21-jdk
    container_name: hive2-runtime-init
    environment:
      JAVA_HOME: /opt/java8
      MAVEN_OPTS: "-Dmaven.repo.local=/m2"
    command: >
      bash -lc '
        set -euo pipefail;
        rm -rf /opt/hadoop/* /opt/hive/*;
        mkdir -p /opt/hadoop /opt/hive/bin /opt/hive/conf /opt/hive/lib /opt/hive/scripts/metastore /tmp/hadoop-extract;
        tar -xzf /input/hadoop-2.7.2.tar.gz -C /tmp/hadoop-extract;
        cp -a /tmp/hadoop-extract/hadoop-2.7.2/. /opt/hadoop/;
        cp -a /src/bin/. /opt/hive/bin/;
        cp -a /src/conf/. /opt/hive/conf/;
        cp -a /src/metastore/scripts/. /opt/hive/scripts/metastore/;
        chmod +x /opt/hive/bin/* /opt/hive/bin/ext/*.sh || true;
        printf "%s\n" \
          "#!/usr/bin/env bash" \
          "exec hive -S \"\$$@\" 2>/dev/null" \
          > /opt/hive/bin/hive-quiet;
        chmod +x /opt/hive/bin/hive-quiet;
        /usr/share/maven/bin/mvn -f /src/pom.xml -pl packaging dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=/opt/hive/lib;
        rm -f /opt/hive/lib/hive-jdbc-*-standalone.jar;
        rm -f /opt/hive/lib/log4j-slf4j-impl-*.jar;
        rm -f /opt/hive/lib/postgresql-*.jar;
        cp /m2/org/postgresql/postgresql/42.7.8/postgresql-42.7.8.jar /opt/hive/lib/;
        echo prepared > /opt/hive/.prepared
      '
    volumes:
      - /usr/lib/jvm/java-8-openjdk-amd64:/opt/java8:ro
      - /usr/share/maven:/usr/share/maven:ro
      - /usr/share/java:/usr/share/java:ro
      - /etc/maven:/etc/maven:ro
      - /home/gregory/.m2/repository:/m2
      - /home/gregory/dev/tmp/hadoop-2.7.2.tar.gz:/input/hadoop-2.7.2.tar.gz:ro
      - ../..:/src:ro
      - hadoop-home:/opt/hadoop
      - hive-home:/opt/hive

  postgres:
    image: postgres:12
    container_name: hive2-postgres
    hostname: postgres
    environment:
      POSTGRES_DB: metastore_db
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - hive2

  zookeeper:
    image: zookeeper:3.8.4
    container_name: hive2-zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/data
      - zookeeper-datalog:/datalog
    networks:
      - hive2

  metastore-schema:
    image: eclipse-temurin:21-jdk
    container_name: hive2-metastore-schema
    depends_on:
      runtime-init:
        condition: service_completed_successfully
      postgres:
        condition: service_started
    environment:
      JAVA_HOME: /opt/java8
      HADOOP_HOME: /opt/hadoop
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      HIVE_HOME: /opt/hive
      HIVE_CONF_DIR: /opt/hive/conf
      PATH: /opt/java8/bin:/opt/hadoop/bin:/opt/hive/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: >
      bash -lc '
        set -euo pipefail;
        export PATH="$$JAVA_HOME/bin:$$HADOOP_HOME/bin:$$HIVE_HOME/bin:$$PATH";
        chmod 1777 /scratch /warehouse;
        printf "%s\n" \
          "<?xml version=\"1.0\"?>" \
          "<configuration>" \
          "  <property><name>javax.jdo.option.ConnectionURL</name><value>jdbc:postgresql://postgres:5432/metastore_db</value></property>" \
          "  <property><name>javax.jdo.option.ConnectionDriverName</name><value>org.postgresql.Driver</value></property>" \
          "  <property><name>javax.jdo.option.ConnectionUserName</name><value>hive</value></property>" \
          "  <property><name>javax.jdo.option.ConnectionPassword</name><value>password</value></property>" \
          "  <property><name>hive.metastore.schema.verification</name><value>true</value></property>" \
          "  <property><name>hive.metastore.uris</name><value>zookeeper:2181</value></property>" \
          "  <property><name>hive.metastore.service.discovery.mode</name><value>zookeeper</value></property>" \
          "  <property><name>hive.metastore.zookeeper.namespace</name><value>hive_metastore</value></property>" \
          "  <property><name>hive.metastore.zookeeper.client.port</name><value>2181</value></property>" \
          "  <property><name>hive.metastore.warehouse.dir</name><value>file:///warehouse</value></property>" \
          "  <property><name>hive.exec.scratchdir</name><value>file:///scratch</value></property>" \
          "  <property><name>hive.execution.engine</name><value>mr</value></property>" \
          "  <property><name>mapreduce.framework.name</name><value>local</value></property>" \
          "  <property><name>hive.server2.authentication</name><value>NONE</value></property>" \
          "  <property><name>hive.server2.thrift.bind.host</name><value>0.0.0.0</value></property>" \
          "  <property><name>hive.server2.thrift.port</name><value>10000</value></property>" \
          "</configuration>" \
          > "$$HIVE_CONF_DIR/hive-site.xml";
        until "$$JAVA_HOME/bin/java" -version >/dev/null 2>&1 && (echo > /dev/tcp/postgres/5432) >/dev/null 2>&1; do sleep 1; done;
        schematool -dbType postgres -info || schematool -dbType postgres -initSchema
      '
    volumes:
      - /usr/lib/jvm/java-8-openjdk-amd64:/opt/java8:ro
      - hadoop-home:/opt/hadoop
      - hive-home:/opt/hive
      - warehouse:/warehouse
      - scratch:/scratch
    networks:
      - hive2

  metastore:
    image: eclipse-temurin:21-jdk
    container_name: hive2-metastore
    hostname: metastore
    depends_on:
      metastore-schema:
        condition: service_completed_successfully
      zookeeper:
        condition: service_started
    environment:
      JAVA_HOME: /opt/java8
      HADOOP_HOME: /opt/hadoop
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      HIVE_HOME: /opt/hive
      HIVE_CONF_DIR: /opt/hive/conf
      PATH: /opt/java8/bin:/opt/hadoop/bin:/opt/hive/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      HADOOP_CLIENT_OPTS: "-Dlog4j2.formatMsgNoLookups=true -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5005"
    command: >
      bash -lc '
        export PATH="$$JAVA_HOME/bin:$$HADOOP_HOME/bin:$$HIVE_HOME/bin:$$PATH";
        chmod 1777 /scratch /warehouse;
        hive --service metastore \
          --hiveconf hive.root.logger=INFO,console \
          --hiveconf hive.metastore.thrift.bind.host=metastore
      '
    ports:
      - "9083:9083"
      - "5005:5005"
    volumes:
      - /usr/lib/jvm/java-8-openjdk-amd64:/opt/java8:ro
      - hadoop-home:/opt/hadoop
      - hive-home:/opt/hive
      - warehouse:/warehouse
      - scratch:/scratch
    networks:
      - hive2

  metastore2:
    image: eclipse-temurin:21-jdk
    container_name: hive2-metastore2
    hostname: metastore2
    depends_on:
      metastore-schema:
        condition: service_completed_successfully
      zookeeper:
        condition: service_started
    environment:
      JAVA_HOME: /opt/java8
      HADOOP_HOME: /opt/hadoop
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      HIVE_HOME: /opt/hive
      HIVE_CONF_DIR: /opt/hive/conf
      PATH: /opt/java8/bin:/opt/hadoop/bin:/opt/hive/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      HADOOP_CLIENT_OPTS: "-Dlog4j2.formatMsgNoLookups=true -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5007"
    command: >
      bash -lc '
        export PATH="$$JAVA_HOME/bin:$$HADOOP_HOME/bin:$$HIVE_HOME/bin:$$PATH";
        chmod 1777 /scratch /warehouse;
        hive --service metastore \
          --hiveconf hive.root.logger=INFO,console \
          --hiveconf hive.metastore.thrift.bind.host=metastore2
      '
    ports:
      - "9084:9083"
      - "5007:5007"
    volumes:
      - /usr/lib/jvm/java-8-openjdk-amd64:/opt/java8:ro
      - hadoop-home:/opt/hadoop
      - hive-home:/opt/hive
      - warehouse:/warehouse
      - scratch:/scratch
    networks:
      - hive2

  hiveserver2:
    image: eclipse-temurin:21-jdk
    container_name: hive2-hiveserver2
    hostname: hiveserver2
    depends_on:
      metastore:
        condition: service_started
      metastore2:
        condition: service_started
    environment:
      JAVA_HOME: /opt/java8
      HADOOP_HOME: /opt/hadoop
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      HIVE_HOME: /opt/hive
      HIVE_CONF_DIR: /opt/hive/conf
      PATH: /opt/java8/bin:/opt/hadoop/bin:/opt/hive/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      HADOOP_CLIENT_OPTS: "-Dlog4j2.formatMsgNoLookups=true"
    command: >
      bash -lc '
        export PATH="$$JAVA_HOME/bin:$$HADOOP_HOME/bin:$$HIVE_HOME/bin:$$PATH";
        chmod 1777 /scratch /warehouse;
        until (echo > /dev/tcp/metastore/9083) >/dev/null 2>&1; do sleep 1; done;
        until (echo > /dev/tcp/metastore2/9083) >/dev/null 2>&1; do sleep 1; done;
        hiveserver2 --debug:port=5006,mainSuspend=n --hiveconf hive.root.logger=INFO,console
      '
    ports:
      - "10000:10000"
      - "10002:10002"
      - "5006:5006"
    volumes:
      - /usr/lib/jvm/java-8-openjdk-amd64:/opt/java8:ro
      - hadoop-home:/opt/hadoop
      - hive-home:/opt/hive
      - warehouse:/warehouse
      - scratch:/scratch
    networks:
      - hive2

volumes:
  hadoop-home:
  hive-home:
  postgres-data:
  zookeeper-data:
  zookeeper-datalog:
  warehouse:
  scratch:

networks:
  hive2:
