name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - '*'
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  MAVEN_ARGS: -B -V -e -ntp -DskipTests -Dmaven.javadoc.skip=true

jobs:
  publish:
    # Publishing a release in the web UI also pushes its tag, and the tag push deploys.
    if: github.event_name != 'release'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          server-id: arenadata
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Maven Deploy
        run: mvn ${{ env.MAVEN_ARGS }} --batch-mode deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dist:
    if: github.event_name == 'release'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          server-id: arenadata
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Build the binary distribution
        run: mvn ${{ env.MAVEN_ARGS }} --batch-mode package -Pdist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach the distribution to the release
        run: |
          TARBALL="packaging/target/apache-hive-${RELEASE_TAG#v}-bin.tar.gz"
          if [[ ! -f "$TARBALL" ]]; then
            echo "::error::$TARBALL not found: the release tag does not match the pom version."
            ls -l packaging/target/*.tar.gz || true
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "$TARBALL" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
