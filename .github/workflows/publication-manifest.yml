# Regenerates .readiness/publication.yaml for ADRM by running the publisher exactly as publish.yml does
# (Maven deploy of all modules), with deployment redirected into a sandbox directory by
# arenadata/adrm-checks. Nothing can be uploaded: the job only has packages: read.
# Run it by hand to refresh the manifest (it opens a pull request when the module/file set changed);
# on pull requests that touch the build it fails when the manifest is stale.
# The dist job of publish.yml (binary tarball attached to a GitHub release) is not a registry
# publication and is not part of the manifest.
name: Publication manifest
on:
  workflow_dispatch:
  pull_request:
    paths: ['**/pom.xml', '.github/workflows/publish.yml', '.readiness/publication.yaml']

permissions:
  contents: write
  pull-requests: write
  packages: read

env:
  MAVEN_ARGS: -B -V -e -ntp -DskipTests -Dmaven.javadoc.skip=true

jobs:
  manifest:
    # The bot's own manifest pull request was just produced by this workflow: do not rebuild to re-check it.
    if: github.event_name != 'pull_request' || github.head_ref != 'readiness/publication-manifest'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: arenadata
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Redirect the publisher to a sandbox
        id: sandbox
        uses: arenadata/adrm-checks/actions/sandbox@e63ce686a8c4235104f56ea292e47b9003acbd9a
        with:
          tool: maven
          deploy-plugin-major: '3'   # maven-deploy-plugin 3.1.4 via the parent org.apache:apache:35
      - name: Run the publisher exactly as publish.yml does
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn ${{ env.MAVEN_ARGS }} --batch-mode deploy
      - name: Generate the manifest from the sandbox
        id: manifest
        uses: arenadata/adrm-checks/actions/manifest@e63ce686a8c4235104f56ea292e47b9003acbd9a
        with:
          sandbox: ${{ steps.sandbox.outputs.dir }}
          invocations: '1'
      - name: Open a pull request when the module/file set changed
        if: steps.manifest.outputs.changed == 'true' && github.event_name == 'workflow_dispatch'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          # Commit only the manifest
          add-paths: .readiness/publication.yaml
          branch: readiness/publication-manifest
          title: 'readiness: refresh publication manifest'
          commit-message: 'readiness: refresh publication manifest from the publisher sandbox'
          body: 'The module/file set produced by the publisher differs from .readiness/publication.yaml. Review the diff: added entries are new publications, removed entries are publications that disappeared.'
      - name: Fail the pull request check when the manifest is stale
        if: steps.manifest.outputs.changed == 'true' && github.event_name == 'pull_request'
        run: |
          git --no-pager diff -- .readiness/publication.yaml
          echo "::error::.readiness/publication.yaml is stale; run the Publication manifest workflow"; exit 1
