name: CI

on:
  push:
    branches: ['develop/**', 'release/**']
  pull_request:
    branches: ['develop/**', 'release/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: -B -V -e -ntp
  MAVEN_OPTS: -Xmx4g

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: temurin
        cache: maven
        server-id: arenadata
        server-username: GITHUB_ACTOR
        server-password: GITHUB_TOKEN
    - name: Compile
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: >-
        mvn ${{ env.MAVEN_ARGS }} install -DskipTests
        -Dmaven.javadoc.skip=true
    - name: Save m2 repository
      uses: actions/cache/save@v4
      with:
        path: ~/.m2/repository
        key: m2-${{ github.sha }}

  test:
    name: "${{ matrix.name }}"
    needs: compile
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Metastore
            modules: standalone-metastore/metastore-common,standalone-metastore/metastore-server,standalone-metastore/metastore-rest-catalog
            timeout: 90

          - name: Core
            modules: storage-api,common,serde,parser,udf,service-rpc,classification,shims,shims/0.23,shims/aggregator,vector-code-gen,llap-common,llap-client,llap-tez,llap-ext-client,llap-server,testutils,jdbc,beeline,cli,contrib,jdbc-handler,hplsql,service
            timeout: 90

          - name: QL (txn & compactor)
            modules: ql
            tests: "TestTxn*,TestCompact*,TestCleaner*,TestWorker,TestInitiator*,TestAbort*,TestDeltaFiles*,TestMRCompactor*,TestHeartbeat*"
            timeout: 150

          - name: QL (rest)
            modules: ql
            tests: "!TestTxn*,!TestCompact*,!TestCleaner*,!TestWorker,!TestInitiator*,!TestAbort*,!TestDeltaFiles*,!TestMRCompactor*,!TestHeartbeat*"
            timeout: 150

          - name: HCatalog & Streaming
            modules: hcatalog/core,hcatalog/hcatalog-pig-adapter,hcatalog/server-extensions,hcatalog/webhcat/java-client,hcatalog/webhcat/svr,streaming
            timeout: 60

          - name: HBase Handler
            modules: hbase-handler
            timeout: 60

          - name: Iceberg Catalog
            modules: iceberg/iceberg-catalog
            timeout: 60

          - name: Iceberg Handler
            modules: iceberg/iceberg-handler
            timeout: 90

          - name: Kafka
            modules: kafka-handler
            timeout: 45

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: temurin
        server-id: arenadata
        server-username: GITHUB_ACTOR
        server-password: GITHUB_TOKEN
    - name: Restore m2 repository
      uses: actions/cache/restore@v4
      with:
        path: ~/.m2/repository
        key: m2-${{ github.sha }}
    - name: Prepare metastore schema scripts
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mkdir -p target/tmp
        mvn ${{ env.MAVEN_ARGS }} process-test-resources \
          -pl standalone-metastore/metastore-server,ql \
          -Dmaven.javadoc.skip=true
    - name: Run tests
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: >-
        mvn ${{ env.MAVEN_ARGS }} test
        -pl ${{ matrix.modules }}
        ${{ matrix.tests && format('-Dtest={0}', matrix.tests) || '' }}
        -Dmaven.javadoc.skip=true
        -Dsurefire.rerunFailingTestsCount=2
        -Dmaven.test.failure.ignore=false
        -fae
    - name: Upload surefire reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: surefire-${{ matrix.name }}
        path: '**/target/surefire-reports/'
        if-no-files-found: ignore
