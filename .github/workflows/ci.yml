name: CI

on:
  pull_request:
    branches:
      - 'develop/**'
      - 'release/**'

env:
  MAVEN_OPTS: '-Xmx4g'

jobs:
  test:
    name: 'Test (${{ matrix.group }})'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: metastore
            modules: "standalone-metastore/metastore-common,standalone-metastore/metastore-server,standalone-metastore/metastore-rest-catalog"
          - group: core
            modules: "storage-api,common,serde,parser,udf,service-rpc,classification,shims,shims/0.23,shims/aggregator,vector-code-gen,llap-common,llap-client,llap-tez,llap-ext-client,llap-server,testutils,jdbc,beeline,cli,contrib,jdbc-handler,hplsql,service"
          - group: ql
            modules: "ql"
          - group: hcatalog
            modules: "hcatalog/core,hcatalog/hcatalog-pig-adapter,hcatalog/server-extensions,hcatalog/webhcat/java-client,hcatalog/webhcat/svr,streaming"
          - group: handlers
            modules: "accumulo-handler,druid-handler,hbase-handler,kudu-handler,iceberg/iceberg-catalog,iceberg/iceberg-handler"
          - group: kafka
            modules: "kafka-handler"
    steps:
      - uses: actions/checkout@v4

      - name: 'Set up JDK 21'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 'Cache Maven repository'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-

      - name: 'Build dependencies'
        run: |
          mvn -B install -pl ${{ matrix.modules }} -am -Pitests -DskipTests

      - name: 'Run tests — ${{ matrix.group }}'
        run: |
          mvn -B test -pl ${{ matrix.modules }} -Pitests -Dmaven.test.failure.ignore=false

      - name: 'Upload test reports'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.group }}
          path: '**/surefire-reports/'
          retention-days: 7

      - name: 'Publish test results'
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '**/surefire-reports/TEST-*.xml'
          check_name: 'Test Results (${{ matrix.group }})'
